name: Prospecção MVP — segurança e testes
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verificar sintaxe, testes e regras de importação
        run: npm run check
      - name: Verificar arquivos PWA
        run: |
          test -f index.html
          test -f assets/tokens.css
          test -f assets/components.css
          test -f landing/index.html
          test -f manifest.webmanifest
          test -f src/app.mjs
          ! grep -R "message/sendText" src/ || exit 1
      - name: Instalar Playwright fixado
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
      - name: Verificar supressão no navegador móvel (somente dados fictícios)
        run: |
          npm run dev > /tmp/flowbot-prospeccao.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          npm run test:e2e:suppression
