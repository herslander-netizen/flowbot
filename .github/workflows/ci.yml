name: Prospecção — testes de domínio e backend
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verificar sintaxe e testes
        run: |
          node --check src/prospecting.mjs
          node --check src/app.mjs
          node --check src/prospeccao-api-client.mjs
          node --check worker/index.mjs
          npm test
      - name: Verificar PWA sem disparos
        run: |
          test -f index.html
          test -f assets/styles.css
          test -f manifest.webmanifest
          test -f src/app.mjs
          test -f db/migrations/001_prospeccao.sql
          ! grep -R "message/sendText" src/ worker/
