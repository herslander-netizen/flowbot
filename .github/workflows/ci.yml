name: Prospecção MVP — segurança e testes
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verificar sintaxe, testes e regras de importação
        run: npm run check
      - name: Verificar arquivos PWA
        run: |
          test -f index.html
          test -f assets/styles.css
          test -f manifest.webmanifest
          test -f src/app.mjs
          ! grep -R "message/sendText" src/ || exit 1
